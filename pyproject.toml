[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/briefsnap"]

[project]
name = "briefsnap"
version = "0.1.0"
description = "Morning briefing aggregator — one command pulls HN, RSS, Bluesky, GitHub, and arXiv into a single digest"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "hackersnap>=0.2.0",
    "feedsnap>=0.9.0",
    "bskysnap>=0.2.0",
    "rook-reposnap>=0.3.0",
    "arxivsnap>=0.2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
briefsnap = "briefsnap.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
